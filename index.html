<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aún me gustas</title>
    <link rel="stylesheet" href="style.css  ">
</head>

<body>

    <header class="header">
        <h1 class="titulo">Para Elisa Soto</h1>
        <p class="subtitle">
            Una carta de amor para la persona que me dejó enamorado
        </p>

    </header>

    <main>
        <div class="contenedor">
            <input type="checkbox" id="abrir">
            <label for="abrir" class="carta">
                <div class="sobre">
                    <div class="tapa"></div>
                    <div class="sello"></div>
                </div>
                <div class="papel">
                    <div class="contenido">
                        <section class="bloque">
                            <h2 class="titulo-carta">Gracias</h2>
                            <p>
                                Quiero decirte que durante mucho tiempo estuve buscando tu perdón,
                                pero nunca me lo gané. Siempre intenté buscar una manera de gustarte o mejorar, 
                                pero nunca mejoré como persona. Puede que yo haya cambiado, 
                                pero no soy la persona que tú tanto quisiste, 
                                ni siquiera fui la persona que te dije que era.
                            </p>
                            <p>
                                Durante el tiempo que estábamos hablando, 
                                siempre te mentí sobre quién era yo, 
                                pero hoy en día realmente soy yo. 
                                Ahora sé quién soy, ahora sé qué es lo que quiero. 
                                Pero ahora que ya no te tengo, me siento mal, 
                                pero no mal porque estoy solo, 
                                sino que me siento mal por todo lo que hice y por todo lo que no dije.
                            </p>
                            <p>
                                Tú te merecías a alguien mejor y, créeme, lo intenté, 
                                pero intentarlo no bastaba. Como dije, ya no busco tu perdón; 
                                solo quiero aclarar todo lo que no pude hacer en persona.
                            </p>
                            <p>
                                Cuídate, pásalo bien, ríe, diviértete y disfruta tu vida. 
                                Eso es todo lo que quiero para ti.
                            </p>
                            <p>
                                Siempre quise decirte cosas lindas a la cara, pero me daba miedo, 
                                me ponía nervioso. Pero quiero que sepas que me gustas. 
                                Aunque no lo parece, aunque no lo haga notar, siempre me gustaste.
                            </p>
                            <p>
                                Y por eso te digo gracias. Gracias por todo lo que hiciste por mí. 
                                Gracias a ti puedo mejorar, solo que esta vez no podré estar contigo. 
                                Pero, aun así, quiero lo mejor para ti.
                                También quiero agradecerte por haber llegado a mi vida, 
                                ya que fuiste lo mejor que me pudo pasar.
                                Gracias por todo, Elisa Soto. Espero que tengas una linda vida.
                            </p>
                        </section>
                        <section class="bloque">
                            <h5>De: Marcelo Ríos</h5>
                        </section>
                    </div>
                </div>
            </label>
        </div>
    </main>
</body>
</html>
